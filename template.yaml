AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: aws-multilingual-tts, hệ thống Text-to-Speech đa ngôn ngữ (M1 sở hữu file này)

Parameters:
  Env:
    Type: String
    Default: dev

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        ENV: !Ref Env
        PRESIGN_TTL_SECONDS: "3600"
        SYNC_MAX_CHARS: "2500"
        CHUNK_SIZE: "2500"
        MAX_CHARS: "20000"
        JOB_TTL_DAYS: "30"
        # TODO (M1): thêm AUDIO_BUCKET, JOBS_TABLE, QUEUE_URL, SYNTH_FUNCTION_NAME,
        # EXTERNAL_TTS_SECRET_NAME khi các module tạo tài nguyên tương ứng.

Resources:
  # TODO (M1): nối các file trong infra/ (m1 đến m5) bằng AWS::Serverless::Application,
  # truyền giá trị chung qua Parameters/Outputs. Xóa ProjectMarker khi đã có tài nguyên thật.
  ProjectMarker:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /tts/${Env}/project
      Type: String
      Value: aws-multilingual-tts

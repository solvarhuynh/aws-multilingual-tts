AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: aws-multilingual-tts SAM root infrastructure for AWS Academy Sandbox architecture

Metadata:
  ConfigurationStatus:
    Plan: PROPOSED
    SandboxValidation: VERIFIED GATE 0 (Lambda AccessDenied on Lab 1 IAM; Fallback B evaluated)
    Deployment: READY FOR SAM BUILD / DEPLOY
    TargetRegion: us-east-1
    TargetFlow: CloudFront -> Lambda HTTP Router -> Downstream Handlers (Submit, Voices, History, Stats) -> Async Synthesize Worker

Parameters:
  Env:
    Type: String
    Default: dev
    Description: Môi trường triển khai (dev/prod)

  AllowedOrigin:
    Type: String
    Default: "*"
    Description: Frontend origin được phép gọi CORS

  DemoToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: Token demo bảo vệ API (được truyền an toàn)

  JobsBucketName:
    Type: String
    Default: ""
    Description: Tên S3 bucket chứa dữ liệu JSON jobs (nếu để trống template sẽ tạo tts-jobs-<account>-<env>)

  AudioBucketName:
    Type: String
    Default: ""
    Description: Tên S3 bucket chứa audio MP3 (nếu để trống template sẽ tạo tts-audio-<account>-<env>)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
    Environment:
      Variables:
        ENV: !Ref Env
        AWS_ACCOUNT_ID: !Sub "${AWS::AccountId}"
        JOBS_PREFIX: "jobs/"

Conditions:
  CreateJobsBucket: !Equals [!Ref JobsBucketName, ""]
  CreateAudioBucket: !Equals [!Ref AudioBucketName, ""]

Resources:
  # ============================================================================
  # 1. STORAGE: S3 BUCKETS (M3)
  # ============================================================================
  JobsBucket:
    Type: AWS::S3::Bucket
    Condition: CreateJobsBucket
    Properties:
      BucketName: !Sub "tts-jobs-${AWS::AccountId}-${Env}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  AudioBucket:
    Type: AWS::S3::Bucket
    Condition: CreateAudioBucket
    Properties:
      BucketName: !Sub "tts-audio-${AWS::AccountId}-${Env}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  # ============================================================================
  # 2. HTTP ROUTER & API SECURITY (M1)
  # ============================================================================
  HttpRouterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tts-http-router-${Env}"
      CodeUri: backend/http/
      Handler: app.handler
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          DEMO_TOKEN: !Ref DemoToken
          SUBMIT_FUNCTION_NAME: !Sub "tts-submit-${Env}"
          VOICES_FUNCTION_NAME: !Sub "tts-voices-${Env}"
          HISTORY_FUNCTION_NAME: !Sub "tts-history-${Env}"
          STATS_FUNCTION_NAME: !Sub "tts-stats-${Env}"
      FunctionUrlConfig:
        AuthType: AWS_IAM
        Cors:
          AllowOrigins:
            - !Ref AllowedOrigin
          AllowMethods:
            - GET
            - POST
            - DELETE
            - OPTIONS
          AllowHeaders:
            - Content-Type
            - X-Demo-Token
            - Idempotency-Key
            - x-amz-content-sha256
          MaxAge: 86400

  HttpRouterFunctionUrlOacPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HttpRouterFunction
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      FunctionUrlAuthType: AWS_IAM

  # ============================================================================
  # 3. DOWNSTREAM LAMBDA FUNCTIONS (M2, M3, M5)
  # ============================================================================
  SubmitFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tts-submit-${Env}"
      CodeUri: backend/submit/
      Handler: app.handler
      Environment:
        Variables:
          JOBS_BUCKET: !If [CreateJobsBucket, !Ref JobsBucket, !Ref JobsBucketName]
          SYNTH_FUNCTION_NAME: !Sub "tts-synthesize-worker-${Env}"

  VoicesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tts-voices-${Env}"
      CodeUri: backend/voices/
      Handler: app.handler

  HistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tts-history-${Env}"
      CodeUri: backend/history/
      Handler: app.handler
      Environment:
        Variables:
          JOBS_BUCKET: !If [CreateJobsBucket, !Ref JobsBucket, !Ref JobsBucketName]
          AUDIO_BUCKET: !If [CreateAudioBucket, !Ref AudioBucket, !Ref AudioBucketName]

  StatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tts-stats-${Env}"
      CodeUri: backend/stats/
      Handler: app.handler
      Environment:
        Variables:
          JOBS_BUCKET: !If [CreateJobsBucket, !Ref JobsBucket, !Ref JobsBucketName]

  SynthesizeWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tts-synthesize-worker-${Env}"
      CodeUri: backend/synthesize/
      Handler: app.handler
      Timeout: 180
      MemorySize: 512
      Environment:
        Variables:
          JOBS_BUCKET: !If [CreateJobsBucket, !Ref JobsBucket, !Ref JobsBucketName]
          AUDIO_BUCKET: !If [CreateAudioBucket, !Ref AudioBucket, !Ref AudioBucketName]

  # Event invoke config cho worker async (M2 sở hữu)
  WorkerEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref SynthesizeWorkerFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 1
      MaximumEventAgeInSeconds: 300

  # ============================================================================
  # 4. MONITORING: CLOUDWATCH & SNS ALARMS (M1)
  # ============================================================================
  AlarmsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "tts-alarms-${Env}"
      DisplayName: "TTS System Alarms"

  RouterErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "tts-router-errors-${Env}"
      AlarmDescription: "Cảnh báo khi Lambda HTTP Router gặp lỗi thực thi (5xx)"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref HttpRouterFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmsTopic

  RouterThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "tts-router-throttles-${Env}"
      AlarmDescription: "Cảnh báo khi Lambda HTTP Router bị throttle vượt giới hạn đồng thời"
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref HttpRouterFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmsTopic

  WorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "tts-worker-errors-${Env}"
      AlarmDescription: "Cảnh báo khi Worker chuyển giọng gặp lỗi"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SynthesizeWorkerFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmsTopic

  # Dashboard giám sát tập trung toàn hệ thống
  SystemDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "tts-dashboard-${Env}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "tts-http-router-${Env}", { "label": "Router Invocations" } ],
                  [ ".", ".", "FunctionName", "tts-submit-${Env}", { "label": "Submit Invocations" } ],
                  [ ".", ".", "FunctionName", "tts-synthesize-worker-${Env}", { "label": "Worker Invocations" } ],
                  [ ".", ".", "FunctionName", "tts-history-${Env}", { "label": "History Invocations" } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "us-east-1",
                "title": "Lambda Invocations by Service"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Errors", "FunctionName", "tts-http-router-${Env}", { "color": "#d62728", "label": "Router Errors" } ],
                  [ ".", ".", "FunctionName", "tts-submit-${Env}", { "color": "#ff7f0e", "label": "Submit Errors" } ],
                  [ ".", ".", "FunctionName", "tts-synthesize-worker-${Env}", { "color": "#e377c2", "label": "Worker Errors" } ],
                  [ ".", "Throttles", "FunctionName", "tts-http-router-${Env}", { "color": "#9467bd", "label": "Router Throttles" } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "us-east-1",
                "title": "Errors & Throttles"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Duration", "FunctionName", "tts-http-router-${Env}", { "stat": "Average", "label": "Router Avg Latency" } ],
                  [ ".", ".", "FunctionName", "tts-synthesize-worker-${Env}", { "stat": "Average", "label": "Worker Avg Duration" } ]
                ],
                "view": "timeSeries",
                "region": "us-east-1",
                "title": "Execution Duration (ms)"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "AsyncEventsReceived", "FunctionName", "tts-synthesize-worker-${Env}" ],
                  [ ".", "AsyncEventsDropped", ".", "." ],
                  [ ".", "AsyncEventAge", ".", ".", { "stat": "Maximum" } ]
                ],
                "view": "timeSeries",
                "region": "us-east-1",
                "title": "Async Event Queue Metrics"
              }
            }
          ]
        }

Outputs:
  HttpRouterFunctionArn:
    Description: ARN của Lambda HTTP Router
    Value: !GetAtt HttpRouterFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-HttpRouterArn"

  HttpRouterFunctionUrl:
    Description: URL Endpoint công khai của Lambda HTTP Router
    Value: !GetAtt HttpRouterFunctionUrl.FunctionUrl
    Export:
      Name: !Sub "${AWS::StackName}-HttpRouterUrl"

  JobsBucketArn:
    Description: ARN của S3 Jobs Bucket
    Value: !If [CreateJobsBucket, !GetAtt JobsBucket.Arn, !Sub "arn:aws:s3:::${JobsBucketName}"]
    Export:
      Name: !Sub "${AWS::StackName}-JobsBucketArn"

  AudioBucketArn:
    Description: ARN của S3 Audio Bucket
    Value: !If [CreateAudioBucket, !GetAtt AudioBucket.Arn, !Sub "arn:aws:s3:::${AudioBucketName}"]
    Export:
      Name: !Sub "${AWS::StackName}-AudioBucketArn"

  AlarmsTopicArn:
    Description: ARN của SNS Alarms Topic
    Value: !Ref AlarmsTopic
    Export:
      Name: !Sub "${AWS::StackName}-AlarmsTopicArn"

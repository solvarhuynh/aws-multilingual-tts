AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: aws-multilingual-tts SAM skeleton for proposed AWS Academy Sandbox architecture

Metadata:
  ConfigurationStatus:
    Plan: PROPOSED
    SandboxValidation: PENDING SANDBOX VALIDATION
    Deployment: NOT DEPLOYED
    TargetRegion: us-east-1
    TargetFlow: CloudFront and S3 web to Lambda HTTP entry, async worker, external TTS and private S3

Parameters:
  Env:
    Type: String
    Default: dev

Globals:
  Function:
    Runtime: python3.12
    # Runtime settings and LabRole ARN are added only after contract and Sandbox checks.
    # Proposed env names: JOBS_BUCKET, JOBS_PREFIX, AUDIO_BUCKET, SYNTH_FUNCTION_NAME.
    # TTS_API_PARAMETER_NAME and other secret references depend on an approved mechanism.

Resources:
  # Existing non-secret marker keeps this SAM skeleton structurally valid.
  # It is not the planned secret store or a deployed TTS resource. Do not deploy this skeleton.
  # M1 will replace the marker only after Gate 0 verifies permissions and resources.
  ProjectMarker:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /tts/${Env}/project
      Type: String
      Value: aws-multilingual-tts

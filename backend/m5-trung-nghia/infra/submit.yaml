# Không tạo SQS; hàng đợi nội bộ của Lambda async do AWS quản lý.
# M2 sở hữu EventInvokeConfig của worker; không khai báo lại ở đây.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: M5 submit and stats Lambdas

Parameters:
  Env:
    Type: String
    Default: dev
  LabRoleArn:
    Type: String
    Description: ARN of the existing LabRole
  CommonLayerArn:
    Type: String
  JobsBucket:
    Type: String
  JobsPrefix:
    Type: String
    Default: jobs/
  AudioBucket:
    Type: String
  SynthFunctionName:
    Type: String
  MaxChars:
    Type: Number
    Default: 10000
    MinValue: 1
  DefaultSpeed:
    Type: Number
    Default: 0.9
  DailyCharLimit:
    Type: Number
    Default: 30000
    MinValue: 1
  TtsProvider:
    Type: String
    Default: azure
    AllowedValues: [elevenlabs, azure]
  TranslatorApiParameterName:
    Type: String
    Default: ''
    Description: SSM SecureString name for Azure Translator; leave empty to disable translation
  AzureTranslatorRegion:
    Type: String
    Default: global
    AllowedPattern: '[a-z][a-z0-9]{1,39}'
  AzureSpeechRegion:
    Type: String
    Default: eastasia
    AllowedPattern: '[a-z][a-z0-9]{1,39}'
  GeminiTypoEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  GeminiTtsEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  GeminiTtsModel:
    Type: String
    Default: gemini-3.8-flash-tts
    AllowedValues: [gemini-3.8-flash-tts]
  GeminiEmotionEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  GeminiOcrEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  GeminiOcrModel:
    Type: String
    Default: gemini-3.5-flash-lite
  OcrDailyCallLimit:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 10000
  GeminiApiParameterName:
    Type: String
    Default: ''
    Description: SSM SecureString parameter name; never pass its value here
  GeminiModel:
    Type: String
    Default: gemini-3.6-flash
    Description: Gemini model ID verified for the selected API key
  GeminiTranslationEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  GeminiTranslationTimeoutSeconds:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 30
  TranslationDailyCallLimit:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 10000
  GeminiTimeoutSeconds:
    Type: Number
    Default: 8
    MinValue: 1
    MaxValue: 8
  TypoCheckMaxChars:
    Type: Number
    Default: 1000
    MinValue: 1
    MaxValue: 5000
  TypoMaxChanges:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 20
  TypoDailyCallLimit:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 10000
  StatsScanMaxJobs:
    Type: Number
    Default: 200
    MinValue: 1
    MaxValue: 5000

Resources:
  SubmitFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tts-submit-${Env}"
      CodeUri: ../submit
      Handler: app.handler
      Runtime: python3.12
      Role: !Ref LabRoleArn
      Timeout: 30
      MemorySize: 256
      Layers:
        - !Ref CommonLayerArn
      Environment:
        Variables:
          JOBS_BUCKET: !Ref JobsBucket
          JOBS_PREFIX: !Ref JobsPrefix
          AUDIO_BUCKET: !Ref AudioBucket
          SYNTH_FUNCTION_NAME: !Ref SynthFunctionName
          MAX_CHARS: !Ref MaxChars
          DEFAULT_SPEED: !Ref DefaultSpeed
          DAILY_CHAR_LIMIT: !Ref DailyCharLimit
          TTS_PROVIDER: !Ref TtsProvider
          AZURE_SPEECH_REGION: !Ref AzureSpeechRegion
          TRANSLATOR_API_PARAMETER_NAME: !Ref TranslatorApiParameterName
          AZURE_TRANSLATOR_REGION: !Ref AzureTranslatorRegion
          GEMINI_OCR_ENABLED: !Ref GeminiOcrEnabled
          GEMINI_OCR_MODEL: !Ref GeminiOcrModel
          OCR_DAILY_CALL_LIMIT: !Ref OcrDailyCallLimit
          GEMINI_TYPO_ENABLED: !Ref GeminiTypoEnabled
          GEMINI_TTS_ENABLED: !Ref GeminiTtsEnabled
          GEMINI_TTS_MODEL: !Ref GeminiTtsModel
          GEMINI_EMOTION_ENABLED: !Ref GeminiEmotionEnabled
          GEMINI_API_PARAMETER_NAME: !Ref GeminiApiParameterName
          GEMINI_MODEL: !Ref GeminiModel
          GEMINI_TRANSLATION_ENABLED: !Ref GeminiTranslationEnabled
          GEMINI_TRANSLATION_TIMEOUT_SECONDS: !Ref GeminiTranslationTimeoutSeconds
          TRANSLATION_DAILY_CALL_LIMIT: !Ref TranslationDailyCallLimit
          GEMINI_TIMEOUT_SECONDS: !Ref GeminiTimeoutSeconds
          TYPO_CHECK_MAX_CHARS: !Ref TypoCheckMaxChars
          TYPO_MAX_CHANGES: !Ref TypoMaxChanges
          TYPO_DAILY_CALL_LIMIT: !Ref TypoDailyCallLimit

  StatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tts-stats-${Env}"
      CodeUri: ../stats
      Handler: app.handler
      Runtime: python3.12
      Role: !Ref LabRoleArn
      Timeout: 30
      MemorySize: 256
      Layers:
        - !Ref CommonLayerArn
      Environment:
        Variables:
          JOBS_BUCKET: !Ref JobsBucket
          JOBS_PREFIX: !Ref JobsPrefix
          STATS_SCAN_MAX_JOBS: !Ref StatsScanMaxJobs

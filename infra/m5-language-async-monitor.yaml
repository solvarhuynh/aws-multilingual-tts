# M5 - Trung Nghĩa: submit, gửi Lambda Event cho worker và stats.
# PROPOSED / PENDING SANDBOX VALIDATION / NOT DEPLOYED. Root template.yaml gọi file này.
# Không tạo SQS; hàng đợi nội bộ của Lambda async do AWS quản lý.
# M2 sở hữu EventInvokeConfig của worker; không khai báo lại ở đây.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: M5 submit and stats Lambdas

Parameters:
  Env:
    Type: String
    Default: dev
  LabRoleArn:
    Type: String
    Description: ARN of the existing LabRole
  CommonLayerArn:
    Type: String
  JobsBucket:
    Type: String
  JobsPrefix:
    Type: String
    Default: jobs/
  AudioBucket:
    Type: String
  SynthFunctionName:
    Type: String
  MaxChars:
    Type: Number
    Default: 2000
    MinValue: 1
  DefaultSpeed:
    Type: Number
    Default: 0.9

Resources:
  SubmitFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tts-submit-${Env}"
      CodeUri: ../backend/submit/
      Handler: app.handler
      Runtime: python3.12
      Role: !Ref LabRoleArn
      Timeout: 15
      MemorySize: 256
      Layers:
        - !Ref CommonLayerArn
      Environment:
        Variables:
          JOBS_BUCKET: !Ref JobsBucket
          JOBS_PREFIX: !Ref JobsPrefix
          AUDIO_BUCKET: !Ref AudioBucket
          SYNTH_FUNCTION_NAME: !Ref SynthFunctionName
          MAX_CHARS: !Ref MaxChars
          DEFAULT_SPEED: !Ref DefaultSpeed

  StatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tts-stats-${Env}"
      CodeUri: ../backend/stats/
      Handler: app.handler
      Runtime: python3.12
      Role: !Ref LabRoleArn
      Timeout: 5
      MemorySize: 128
      Layers:
        - !Ref CommonLayerArn

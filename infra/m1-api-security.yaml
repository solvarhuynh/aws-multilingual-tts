# ==============================================================================
# M1 - Minh Lý: HTTP Router, API Security, CloudWatch & SNS Infrastructure
# File: infra/m1-api-security.yaml
# Trạng thái: CODED & LOCALLY TESTED (M1 HTTP Router) - PENDING SANDBOX VALIDATION
# Region mục tiêu: us-east-1. Sử dụng LabRole hiện hữu do trường cấp.
# ==============================================================================
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: M1 HTTP router, alarms and SNS topic

Parameters:
  Env:
    Type: String
    Default: dev
    Description: Môi trường triển khai (mặc định dev)
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: Frontend origin được phép gọi CORS
  DemoToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: Token demo bảo vệ API (được truyền an toàn, không commit value)

Resources:
  # ----------------------------------------------------------------------------
  # 1. Lambda HTTP Router (Cửa ngõ HTTP duy nhất)
  # ----------------------------------------------------------------------------
  HttpRouterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tts-http-router-${Env}"
      CodeUri: ../backend/http/
      Handler: app.handler
      Runtime: python3.12
      Timeout: 15
      MemorySize: 256
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Environment:
        Variables:
          ENV: !Ref Env
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          DEMO_TOKEN: !Ref DemoToken
          SUBMIT_FUNCTION_NAME: !Sub "tts-submit-${Env}"
          VOICES_FUNCTION_NAME: !Sub "tts-voices-${Env}"
          HISTORY_FUNCTION_NAME: !Sub "tts-history-${Env}"
          STATS_FUNCTION_NAME: !Sub "tts-stats-${Env}"
      FunctionUrlConfig:
        AuthType: AWS_IAM
        Cors:
          AllowOrigins:
            - !Ref AllowedOrigin
          AllowMethods:
            - GET
            - POST
            - DELETE
          AllowHeaders:
            - Content-Type
            - X-Demo-Token
            - Idempotency-Key
            - x-amz-content-sha256
          MaxAge: 86400

  # Permission cho CloudFront OAC gọi Function URL qua IAM
  HttpRouterFunctionUrlOacPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HttpRouterFunction
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      FunctionUrlAuthType: AWS_IAM

  # ----------------------------------------------------------------------------
  # 2. SNS Topic nhận cảnh báo hệ thống
  # ----------------------------------------------------------------------------
  AlarmsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "tts-alarms-${Env}"
      DisplayName: "TTS System Alarms"

  # ----------------------------------------------------------------------------
  # 3. CloudWatch Alarms giám sát lỗi và throttle
  # ----------------------------------------------------------------------------
  RouterErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "tts-router-errors-${Env}"
      AlarmDescription: "Cảnh báo khi Lambda HTTP Router gặp lỗi thực thi (5xx)"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref HttpRouterFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmsTopic

  RouterThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "tts-router-throttles-${Env}"
      AlarmDescription: "Cảnh báo khi Lambda HTTP Router bị throttle vượt giới hạn đồng thời"
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref HttpRouterFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmsTopic

Outputs:
  HttpRouterFunctionArn:
    Description: ARN của Lambda HTTP Router
    Value: !GetAtt HttpRouterFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-HttpRouterArn"

  HttpRouterFunctionUrl:
    Description: URL Endpoint của Lambda HTTP Router
    Value: !GetAtt HttpRouterFunctionUrl.FunctionUrl
    Export:
      Name: !Sub "${AWS::StackName}-HttpRouterUrl"

  AlarmsTopicArn:
    Description: ARN của SNS Alarms Topic
    Value: !Ref AlarmsTopic
    Export:
      Name: !Sub "${AWS::StackName}-AlarmsTopicArn"

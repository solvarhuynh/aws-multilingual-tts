AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: aws-multilingual-tts root stack for AWS Academy Sandbox

# Mỗi module giữ template riêng trong infra/; EventInvokeConfig duy nhất nằm ở M2.
# Giá trị key không nằm ở đây; TtsApiParameterName chỉ là tên tham số SSM SecureString.

Parameters:
  Env:
    Type: String
    Default: dev
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Frontend origin allowed by CORS
  DemoToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: Demo access token; pass at deploy time, never commit the value
  TtsApiParameterName:
    Type: String
    Default: /tts/dev/azure-speech
    Description: SSM SecureString name that holds the provider key
  TtsProvider:
    Type: String
    Default: azure
    AllowedValues: [elevenlabs, azure]
  AzureSpeechRegion:
    Type: String
    Default: eastasia
    AllowedPattern: '[a-z][a-z0-9]{1,39}'
  JobsPrefix:
    Type: String
    Default: jobs/
    AllowedPattern: '[a-z0-9-]+/'
  DailyCharLimit:
    Type: Number
    Default: 6000
    MinValue: 1
  StatsScanMaxJobs:
    Type: Number
    Default: 200
    MinValue: 1
    MaxValue: 5000
  GeminiTypoEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  GeminiApiParameterName:
    Type: String
    Default: ''
    Description: Name of an SSM SecureString; never pass the API key itself
  GeminiModel:
    Type: String
    Default: gemini-3.6-flash
  GeminiTranslationEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  TranslationDailyCallLimit:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 10000
  TypoDailyCallLimit:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 10000

Resources:
  Storage:
    Type: AWS::Serverless::Application
    Properties:
      Location: ../backend/m3-trung-duc/infra/storage.yaml
      Parameters:
        Env: !Ref Env
        LabRoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
        JobsPrefix: !Ref JobsPrefix

  TtsCore:
    Type: AWS::Serverless::Application
    Properties:
      Location: ../backend/m2-trung-khang/infra/tts.yaml
      Parameters:
        Env: !Ref Env
        LabRoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
        CommonLayerArn: !GetAtt Storage.Outputs.CommonLayerArn
        JobsBucket: !GetAtt Storage.Outputs.JobsBucketName
        JobsPrefix: !Ref JobsPrefix
        AudioBucket: !GetAtt Storage.Outputs.AudioBucketName
        TtsApiParameterName: !Ref TtsApiParameterName
        TtsProvider: !Ref TtsProvider
        AzureSpeechRegion: !Ref AzureSpeechRegion

  Submit:
    Type: AWS::Serverless::Application
    Properties:
      Location: ../backend/m5-trung-nghia/infra/submit.yaml
      Parameters:
        Env: !Ref Env
        LabRoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
        CommonLayerArn: !GetAtt Storage.Outputs.CommonLayerArn
        JobsBucket: !GetAtt Storage.Outputs.JobsBucketName
        JobsPrefix: !Ref JobsPrefix
        AudioBucket: !GetAtt Storage.Outputs.AudioBucketName
        SynthFunctionName: !GetAtt TtsCore.Outputs.SynthesizeFunctionName
        TtsProvider: !Ref TtsProvider
        AzureSpeechRegion: !Ref AzureSpeechRegion
        GeminiTypoEnabled: !Ref GeminiTypoEnabled
        GeminiApiParameterName: !Ref GeminiApiParameterName
        GeminiModel: !Ref GeminiModel
        GeminiTranslationEnabled: !Ref GeminiTranslationEnabled
        TranslationDailyCallLimit: !Ref TranslationDailyCallLimit
        TypoDailyCallLimit: !Ref TypoDailyCallLimit
        DailyCharLimit: !Ref DailyCharLimit
        StatsScanMaxJobs: !Ref StatsScanMaxJobs

  Api:
    Type: AWS::Serverless::Application
    Properties:
      Location: ../backend/m1-minh-ly/infra/api-security.yaml
      Parameters:
        Env: !Ref Env
        AllowedOrigin: !Ref AllowedOrigin
        DemoToken: !Ref DemoToken

  Hosting:
    Type: AWS::Serverless::Application
    Properties:
      Location: ../frontend/infra/hosting.yaml
      Parameters:
        Env: !Ref Env
        RouterFunctionName: !GetAtt Api.Outputs.HttpRouterFunctionName
        RouterFunctionUrl: !GetAtt Api.Outputs.HttpRouterFunctionUrl

Outputs:
  HttpRouterFunctionUrl:
    Value: !GetAtt Api.Outputs.HttpRouterFunctionUrl
  JobsBucketName:
    Value: !GetAtt Storage.Outputs.JobsBucketName
  AudioBucketName:
    Value: !GetAtt Storage.Outputs.AudioBucketName
  WebBucketName:
    Value: !GetAtt Hosting.Outputs.WebBucketName
  DistributionId:
    Value: !GetAtt Hosting.Outputs.DistributionId
  WebDomain:
    Value: !GetAtt Hosting.Outputs.WebDomain
